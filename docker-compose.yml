services:
  unbound:
    image: mvance/unbound:1.22.0 # fijo la versión a esta
    volumes:
      - ./unbound/unbound.conf:/opt/unbound/etc/unbound/unbound.conf:ro
    ports:
      - "127.0.0.1:5335:5335/tcp"       # solo para probar con dig desde la VM
      - "127.0.0.1:5335:5335/udp"
    restart: unless-stopped
 
  pihole:
    image: pihole/pihole:2026.10.0         # fijar versión antes de entregar
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8080:80/tcp"                   # interfaz web
    environment:
      TZ: ${TZ}
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD}
      FTLCONF_dns_upstreams: "unbound#5335"   # único DNS de salida
      FTLCONF_dns_listeningMode: "ALL"        # necesario en red bridge
    volumes:
      - ./etc-pihole:/etc/pihole
    depends_on:
      - unbound
    restart: unless-stopped
 
  reporter:
    build: ./reporter                   # único servicio con Dockerfile propio
    ports:
      - "8081:8081"
    environment:
      PIHOLE_URL: http://pihole:80
      PIHOLE_PASSWORD: ${PIHOLE_PASSWORD}
    depends_on:
      - pihole
    restart: unless-stopped
